services:
  - type: web
    name: todo-backend
    env: node
    plan: free
    buildCommand: "cd backend && npm install --production=false && npm run build"
    startCommand: "cd backend && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
    healthCheckPath: /health
